name: AI Investor Agent Autonomous Scheduler

on:
  schedule:
    # Runs 3 times a day at realistic market hours:
    # 1. 00:30 UTC (09:30 KST) -> Asian market open & US market close recap
    # 2. 05:00 UTC (14:00 KST) -> Mid-day Asian market & European pre-market
    # 3. 13:30 UTC (22:30 KST) -> US market regular trading open
    - cron: '30 0,5,13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI Investor Agent Simulation
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/runAgentSimulation.mjs
