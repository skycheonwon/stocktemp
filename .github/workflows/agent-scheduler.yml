name: AI Investor Agent Autonomous Scheduler

on:
  schedule:
    # Runs 3 times a day (KST 09:15, 13:15, 18:15 -> UTC 00:15, 04:15, 09:15)
    - cron: '15 0,4,9 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI Investor Agent Simulation
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/runAgentSimulation.mjs
