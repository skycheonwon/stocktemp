name: Sync Stock Prices (Daily Weekdays)

on:
  schedule:
    - cron: '0 21 * * 1-5'  # 화~토 새벽: 21:00 UTC = 한국 새벽 6시 / 베트남 새벽 4시 (미국/한국/베트남 장마감 후)
  workflow_dispatch:        # 수동 실행 가능

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests firebase-admin

      - name: Run Price Sync Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python scripts/sync_prices.py
